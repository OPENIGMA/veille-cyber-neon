<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veille Cyber — Zone Sud</title>
    <meta name="description" content="Dashboard de veille cyber-neon pour l'ordre public, sécurité, radicalités, institutions et zones géographiques du Sud." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="bg-grid"></div>

    <header class="topbar">
      <div class="brand">
        <div class="brand-badge">V</div>
        <div>
          <p class="eyebrow">VEILLE / OBSERVATION</p>
          <h1>VEILLE CYBER</h1>
        </div>
      </div>

      <div class="top-actions">
        <button id="refreshBtn" class="btn btn-primary">MAJ MAINTENANT</button>
        <span id="lastUpdate" class="status-text">Dernière mise à jour : --</span>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar glass">
        <div class="panel-header">
          <span class="label">Filtres</span>
        </div>

        <div class="filter-block">
          <label for="searchInput">Recherche</label>
          <input id="searchInput" type="text" placeholder="Recherche rapide..." />
        </div>

        <div class="filter-block">
          <label>Thèmes</label>
          <div id="themeFilters" class="chip-list"></div>
        </div>

        <div class="filter-block">
          <label>Régions</label>
          <div id="regionFilters" class="chip-list"></div>
        </div>

        <div class="filter-block">
          <label>Départements</label>
          <div id="departmentFilters" class="chip-list"></div>
        </div>

        <div class="filter-block">
          <label>Villes</label>
          <div id="cityFilters" class="chip-list"></div>
        </div>
      </aside>

      <section class="content">
        <div class="stats glass">
          <div class="stat">
            <span class="stat-label">Alertes</span>
            <strong id="countAlerts">0</strong>
          </div>
          <div class="stat">
            <span class="stat-label">Thèmes</span>
            <strong id="countThemes">0</strong>
          </div>
          <div class="stat">
            <span class="stat-label">Régions</span>
            <strong id="countRegions">0</strong>
          </div>
        </div>

        <div class="cards-header">
          <h2>Flux observés</h2>
          <button id="resetFilters" class="btn btn-ghost">Réinitialiser</button>
        </div>

        <div id="cards" class="cards"></div>
      </section>
    </main>

    <script src="./assets/app.js"></script>
  </body>
</html>
