name: Veille Cyber Update

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Collect data
        run: python scripts/collect_feeds.py

      - name: Show git status
        run: |
          echo "--- git status ---"
          git status --porcelain || true
          echo "--- last commits ---"
          git --no-pager log -n 5 --pretty=oneline || true

      - name: Commit & push (rebase-safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # authentification via GITHUB_TOKEN
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git fetch origin main
          git pull --rebase origin main || true
          git add data/veille.json
          git diff --cached --quiet || git commit -m "MAJ veille cyber"
          # push avec protection --force-with-lease pour éviter d'écraser si remote a avancé
          git push --force-with-lease origin HEAD:main
